name: customer_rtc
description: Native Agora RTC and bundled WebView adapters for Android, iOS and HarmonyOS.
publish_to: 'none'
version: 0.3.0

environment:
  sdk: ^3.6.2
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.research.customer_rtc
        pluginClass: CustomerRtcPlugin
      ios:
        pluginClass: CustomerRtcPlugin
      ohos:
        pluginClass: CustomerRtcPlugin
